<!DOCTYPE html>
<html>
<head>
  <title>List a Book</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <nav>
      <h2>Campus Books</h2>
      <div>
        <a href="index.html">Home</a>
        <a href="books.html">Browse Books</a>
        <a href="list-book.html">List a Book</a>
      </div>
    </nav>
  </header>

  <main>
    <div>
      <button onclick="changeFontSize()">Change Heading Size</button>
      <button onclick="toggleForm()">Show/Hide Form</button>
    </div>

    <div class="box" id="form-box">
      <h2 id="form-heading">List a Book</h2>

      <label>Student Name:</label>
      <input type="text" id="name">

      <label>Book Title:</label>
      <input type="text" id="title">

      <label>Author:</label>
      <input type="text" id="author">

      <label>Subject / Category:</label>
      <input type="text" id="category">

      <label>Book Condition:</label>
      <select id="condition">
        <option value="">Select Condition</option>
        <option value="New">New</option>
        <option value="Good">Good</option>
        <option value="Fair">Fair</option>
      </select>

      <button onclick="submitBook()">Submit</button>

      <p id="form-result"></p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
